:root{
  /* Layout: Minecraft GUI stack — death screen (title/ending), inventory-panel board with hotbar dock, written-book clue panel */
  --font-pixel:"NeoDGM","DungGeunMo",ui-monospace,"Courier New",monospace;
  --gui:#c6c6c6; --gui-hi:#ffffff; --gui-lo:#555555; --gui-ink:#3f3f3f; --slot-bg:#d4d4d4; --slot-lo:#373737;
  --btn:#2c2c2c; --btn-ink:#a9a9a9; --btn-edge:#000000; --btn-hover:#ffffff; --btn-off:#5a5a5a;
  --mc-white:#ffffff; --mc-shadow:#3f3f3f; --mc-yellow:#ffff55; --mc-green:#80ff20; --mc-red:#ff5555; --mc-blue:#6f7dff; --mc-gray:#aaaaaa;
  --page:#f3e8cb; --page-edge:#c9b083; --page-ink:#22180b; --page-rule:rgba(110,80,40,.28); --leather:#6b3e1f; --leather-hi:#8e5a30; --leather-lo:#3e220f;
  --tag-leru:#868e96; --tag-k1b:#f6be68; --tag-gx:#e99ca8; --tag-victim:#accaad; --tag-mob:#ffffff;
  --hl:#f6be68; --blocked:rgba(134,142,150,.42); --zone-line:#141414;
  /* map highlight (legend) — Minecraft aqua §b, kept apart from K_1b's orange */
  --hl-map:#55ffff; --hl-map-dk:#00aaaa; --hl-map-edge:#003a3a;
  /* written-book ink (Minecraft formatting colours that stay readable on the page) */
  --ink-adv:#aa00aa; --ink-quote:#555555;
  --death-top:rgba(80,0,0,.376); --death-bot:rgba(128,48,48,.627); --death-base:#f8f8fb;
  --chat-bg:rgba(42,0,0,.56); --chat-ink:rgba(255,236,236,.62);
  --tip-bg:rgba(16,0,16,.95); --tip-edge-a:#5000ff; --tip-edge-b:#28007f;
  --world:#17110c; --dim:rgba(0,0,0,.66);
  --fs-xs:12px; --fs-s:14px; --fs-m:16px; --fs-l:18px; --fs-xl:24px; --slot:46px;
}
html,body{height:100%}
body{background:var(--world);color:var(--mc-white);font-family:var(--font-pixel);font-size:var(--fs-m);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit}
img{image-rendering:auto;-webkit-user-drag:none;user-select:none}
#app{min-height:100%;display:flex;flex-direction:column}
#title,#game{flex:1 0 auto}

/* ---------- MC buttons ---------- */
.mcbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--btn-ink);border:3px solid var(--btn-edge);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);cursor:pointer;text-shadow:2px 2px 0 rgba(0,0,0,.45);letter-spacing:.02em;line-height:1.1;padding:0 14px}
.mcbtn:hover:not(:disabled){border-color:var(--btn-hover);color:var(--mc-white)}
.mcbtn:focus-visible{outline:2px solid var(--mc-yellow);outline-offset:2px}
.mcbtn:disabled{color:var(--btn-off);cursor:default}

/* ---------- Death screen (title + ending) ---------- */
.death{position:relative;min-height:100%;display:flex;flex-direction:column;background:linear-gradient(var(--death-top),var(--death-bot)),var(--death-base);overflow:hidden}
.death .ds-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,22px);padding-block:clamp(28px,9vh,140px) clamp(14px,2vh,24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
.ds-title{margin:0;font-weight:400;font-size:clamp(40px,5.4vw,84px);line-height:1;color:var(--mc-white);text-shadow:.08em .08em 0 var(--mc-shadow);letter-spacing:.01em}
.ds-msg{margin:clamp(4px,1.4vh,14px) 0 0;font-size:clamp(15px,1.55vw,29px);color:var(--mc-white);text-shadow:.1em .1em 0 var(--mc-shadow);word-break:keep-all;text-wrap:balance}
.ds-score{margin:0;font-size:clamp(15px,1.55vw,29px);color:var(--mc-white);text-shadow:.1em .1em 0 var(--mc-shadow)}
.ds-score .y{color:var(--mc-yellow);text-shadow:.1em .1em 0 #3f3f15;font-variant-numeric:tabular-nums}
.ds-btns{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);width:min(800px,100%);margin-top:clamp(14px,6vh,120px)}
.ds-btns .mcbtn{height:clamp(44px,7.2vh,80px);font-size:clamp(16px,1.5vw,28px);width:100%}
.ds-btns .mcbtn.fresh{animation:unlock .9s steps(6) 1}
/* title: arrows sit in side columns so How to Play and the stage button share one width */
#stage-btns{--aw:clamp(44px,7.2vh,80px);--g:clamp(8px,1.6vh,16px);display:grid;grid-template-columns:var(--aw) minmax(0,1fr) var(--aw);gap:var(--g);width:min(calc(800px + 2*var(--aw) + 2*var(--g)),100%)}
#stage-btns #pk-howto{grid-row:1;grid-column:2}
.picker{display:contents}
#stage-btns #pk-prev{grid-row:2;grid-column:1}
#stage-btns #pk-stage{grid-row:2;grid-column:2;min-width:0}
#stage-btns #pk-next{grid-row:2;grid-column:3}
/* stage position under the picker */
#stage-btns .pk-info{grid-row:3;grid-column:1/-1;margin:calc(var(--g)*-.4) 0 0;font-size:clamp(14px,1.2vw,22px);line-height:1.2;color:var(--mc-white);text-shadow:.1em .1em 0 var(--mc-shadow)}
.ds-btns .picker .arrow{width:auto;padding:0}
.arrow svg{height:38%;width:auto;fill:currentColor;shape-rendering:crispEdges;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.45))}
.arrow.prev svg{transform:scaleX(-1)}
.arrow:disabled svg{filter:none}
@keyframes unlock{0%{border-color:var(--mc-yellow);color:var(--mc-yellow)}100%{border-color:var(--btn-edge)}}
.chat{align-self:flex-start;width:min(1320px,69vw);margin:0 0 clamp(16px,12vh,160px) 8px;background:var(--chat-bg);padding:4px 8px 6px;font-size:clamp(14px,1.55vw,29px);line-height:1.24;color:var(--chat-ink);text-align:left;text-shadow:.1em .1em 0 rgba(40,0,0,.18)}
.chat p{margin:0;word-break:keep-all;overflow-wrap:anywhere;position:relative}
.chat p.sys::before{content:"";position:absolute;left:-8px;top:0;bottom:0;width:clamp(3px,.42vw,8px);background:rgba(255,255,255,.35)}
.chat .ye{color:#ffff6a}
@media (max-width:760px){
  .chat{width:auto;align-self:stretch;margin:0 max(8px,env(safe-area-inset-right,0px)) clamp(14px,4vh,40px) max(8px,env(safe-area-inset-left,0px))}
  .ds-btns{margin-top:clamp(10px,3vh,40px)}
}
@media (max-height:620px){ .ds-btns .mcbtn{height:40px} #stage-btns{--aw:40px} .death .ds-main{gap:8px} }

/* ending overlay */
#end{position:fixed;inset:0;z-index:100;overflow:auto;background:linear-gradient(var(--death-top),var(--death-bot)),rgba(248,248,251,.7);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#end .death{background:none;min-height:100%}
#end.show{animation:fadein .7s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- Game screen ---------- */
#game{background:linear-gradient(var(--dim),var(--dim)),var(--dirt) 0 0/64px 64px;image-rendering:pixelated;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gbar{display:flex;align-items:center;gap:14px;max-width:1120px;margin:0 auto 14px}
.gbar .mcbtn{height:38px;font-size:var(--fs-m);flex:none}
.gbar #btn-rules{margin-left:auto}
/* title stays on one line: fitTitle() shrinks it from 48px (phone 24px) only as far as it must to fit */
.gtitle{flex:1 1 auto;min-width:0}
.gtitle h2{margin:0;padding:0 2px 2px 0;font-weight:400;font-size:48px;line-height:1.05;text-shadow:2px 2px 0 var(--mc-shadow);white-space:nowrap;overflow:hidden}
.glayout{display:grid;grid-template-columns:minmax(0,640px) minmax(320px,440px);gap:22px;justify-content:center;align-items:start;max-width:1120px;margin:0 auto}
.gleft{min-width:0}

/* inventory panel */
.inv{background:var(--gui);border:2px solid #000;border-radius:4px;box-shadow:inset 3px 3px 0 var(--gui-hi),inset -3px -3px 0 var(--gui-lo);padding:10px 10px 12px;color:var(--gui-ink)}
.board-wrap{position:relative;display:grid;grid-template-columns:var(--pl,6px) calc(var(--cell)*var(--cols)) var(--pr,6px);grid-template-rows:var(--pt,6px) calc(var(--cell)*var(--rows)) var(--pb,8px);justify-content:center;margin-top:2px}
/* faint Z+ (left) / X+ (bottom) direction guides, stages 3–5 */
.side-ax{display:block;overflow:visible;pointer-events:none;fill:#000;stroke:#000;opacity:.5}
.side-ax text{font-family:var(--font-pixel);stroke:none}
#ax-z{grid-column:1;grid-row:2}
#ax-x{grid-column:2;grid-row:3}
.grid{grid-column:2;grid-row:2;position:relative;display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-template-rows:repeat(var(--rows),var(--cell));touch-action:manipulation;user-select:none;-webkit-user-select:none}
.grid.drag{touch-action:none}
.cell{position:relative;background-size:100% 100%;image-rendering:pixelated;box-shadow:inset 2px 2px 0 rgba(0,0,0,.34),inset -2px -2px 0 rgba(255,255,255,.5);cursor:pointer}
.cell>*{position:absolute;pointer-events:none}
.cell .obj{inset:12%;display:flex;align-items:center;justify-content:center;z-index:2}
.cell .obj img{max-width:100%;max-height:100%;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.28))}
.cell .obj.block{inset:19%;background-size:100% 100%;image-rendering:pixelated;border:2px solid #3a1608;box-shadow:3px 3px 0 rgba(0,0,0,.28)}
.cell .obj.block.ore{border-color:#262626}
.cell.occ .obj.veh{inset:auto 1px 1px auto;width:46%;height:46%;z-index:6}
/* row/column blocked: pixel dither reads the same on bright (lava, sand) and dark (nether) textures; covers object cells too */
.cell .blk{inset:0;background:repeating-conic-gradient(rgba(0,0,0,.5) 0 25%,rgba(134,142,150,.22) 0 50%) 0 0/4px 4px;z-index:3;display:none}
.cell.blocked .blk{display:block}
.cell .memo{inset:5%;display:grid;grid-template-columns:repeat(var(--mc),1fr);grid-template-rows:repeat(var(--mr),1fr);gap:1px;z-index:4}
.cell .memo i{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.34);border-radius:2px;min-width:0;min-height:0}
.cell .memo img{width:86%;height:86%;object-fit:contain}
.cell .xm{inset:10%;z-index:4;display:none}
.cell.x .xm{display:block}
.cell .pc{inset:8%;z-index:5;display:none;background:var(--pbg,var(--slot-bg));box-shadow:inset 2px 2px 0 var(--slot-lo),inset -2px -2px 0 var(--gui-hi);align-items:center;justify-content:center}
.cell.occ .pc{display:flex}
.cell .pc img{width:80%;height:80%;object-fit:contain}
/* the selected piece's own cell gets the same white frame as its hotbar slot */
.cell.me .pc{box-shadow:inset 2px 2px 0 var(--slot-lo),inset -2px -2px 0 var(--gui-hi),0 0 0 2px #fff,0 0 0 4px #000}
.cell.occ .memo,.cell.occ .xm{display:none}
.cell .lab{left:3px;top:3px;z-index:8;background:rgba(238,238,238,.94);color:#262626;border-radius:3px;padding:2px 4px 1px;font-size:clamp(10px,calc(var(--cell)*.23),15px);line-height:1.12;max-width:calc(var(--cell)*1.9);width:max-content;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.grid.nolab .lab{display:none}
.cell .dig{right:3px;top:2px;z-index:8;color:#fff;text-shadow:1px 1px 0 #000,-1px 0 0 #000,0 -1px 0 #000;font-size:clamp(10px,calc(var(--cell)*.24),15px);line-height:1}
@media (hover:hover){
  .cell.can:hover::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.38);z-index:7}
  .grid.drag .cell:hover::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.22);z-index:7}
}
.cell.shake{animation:shake .28s steps(4) 1}
@keyframes shake{25%{translate:-3px 0}50%{translate:3px 0}75%{translate:-2px 0}}
.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ov.zl{z-index:6}.ov.hl{z-index:7}.ov.ax{z-index:9}
.ax text{font-family:var(--font-pixel);font-size:15px}

/* popup (tooltip style) */
#catcher{position:fixed;inset:0;z-index:50;cursor:pointer}
.popup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;width:min(92%,460px);background:var(--tip-bg);padding:14px 16px 12px;cursor:pointer;color:var(--mc-white);text-shadow:2px 2px 0 rgba(0,0,0,.6);box-shadow:0 0 0 2px #100010,0 10px 30px rgba(0,0,0,.45)}
.popup::before{content:"";position:absolute;inset:3px;border:2px solid;border-image:linear-gradient(var(--tip-edge-a),var(--tip-edge-b)) 1;pointer-events:none;opacity:.8}
.popup h3{margin:0 0 10px;font-weight:400;font-size:var(--fs-m);color:var(--mc-yellow)}
.popup h3.bad{color:var(--mc-red);font-size:var(--fs-xl);text-align:center;margin:4px 0 6px}
.popup p{margin:0 0 8px;font-size:var(--fs-m);line-height:1.55;word-break:keep-all}
.popup .foot{margin:10px 0 0;font-size:var(--fs-xs);color:var(--mc-gray);text-align:right}
.popup.pop{animation:popin .18s steps(3) 1}
/* the all-rules popup is long: centre it on the screen (above the phone dock) instead of on the board */
.popup.rules{position:fixed;max-height:calc(100vh - 32px);overflow:auto;z-index:120}
@keyframes popin{from{transform:translate(-50%,-46%);opacity:.3}to{transform:translate(-50%,-50%);opacity:1}}

/* legend */
/* legend: its own panel under the hotbar, so the hotbar sits right below the board */
.lgp{margin-top:14px;padding:10px 10px 8px}
.lgp.folded{padding:0 8px}
.legend{display:flex;flex-direction:column;gap:8px;margin:0 4px}
.lg-row{display:grid;grid-template-columns:40px 1fr;gap:6px;align-items:start}
.lg-k{font-size:var(--fs-s);color:#555;padding-top:8px}
.lg-items{display:flex;flex-wrap:wrap;gap:4px 6px;min-width:0}
.lg-it{display:flex;align-items:center;gap:6px;background:none;border:2px solid transparent;border-radius:3px;padding:2px 6px 2px 2px;color:var(--gui-ink);font-size:var(--fs-m);cursor:pointer;min-height:32px}
.lg-it:hover{background:rgba(255,255,255,.4)}
.lg-it:focus-visible{outline:2px solid var(--gui-ink)}
.lg-it.on{border-color:var(--hl-map-dk);background:rgba(85,255,255,.34)}
.lg-ic{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center}
.lg-ic img{max-width:100%;max-height:100%}
.lg-ic.sw{background-size:100% 100%;image-rendering:pixelated;box-shadow:inset 1px 1px 0 rgba(0,0,0,.35),inset -1px -1px 0 rgba(255,255,255,.5)}
.lg-ic.blk{background-size:100% 100%;image-rendering:pixelated;border:2px solid #3a1608;width:20px;height:20px}
.lg-foot{display:flex;align-items:center;gap:8px}
.lg-hint{flex:1 1 auto;min-width:0;font-size:var(--fs-xs);color:#666;margin:2px 0 0 46px}
.lg-fold{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 2px;min-height:28px;color:#4a4a4a;font-size:var(--fs-xs);cursor:pointer}
.lg-fold:hover{color:#1e1e1e}
.lg-fold:focus-visible{outline:2px solid var(--gui-ink);outline-offset:1px}
.lg-fold svg{width:11px;height:6px;fill:currentColor;shape-rendering:crispEdges}
.legend.folded .lg-row,.legend.folded .lg-hint{display:none}
.legend.folded .lg-fold svg{transform:scaleY(-1)}
.legend.folded .lg-fold{min-height:18px;padding:0 2px;line-height:1}

/* dock: tools + xp + hotbar */
.dock{display:flex;flex-direction:column;align-items:center;gap:7px;margin:12px 0 0}
.actionbar{min-height:20px;font-size:var(--fs-m);color:var(--mc-white);text-shadow:2px 2px 0 var(--mc-shadow);text-align:center;transition:opacity .5s;opacity:0}
.actionbar.on{opacity:1}
.actionbar.mode{color:var(--mc-yellow);text-shadow:2px 2px 0 #3f3f15}
.actionbar.warn{color:var(--mc-red);text-shadow:2px 2px 0 #3f1515}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tool{height:38px;font-size:var(--fs-m);padding:0 12px}
/* switched on ≠ hovered: a green bar along the bottom (XP-bar colour) */
.tool.on{border-color:var(--btn-hover);color:var(--mc-white);background:#454545;box-shadow:inset 0 -4px 0 var(--mc-green),inset 0 0 0 1px rgba(255,255,255,.06)}
.tool.submit{color:var(--mc-yellow);position:relative}
.tool.submit.guide::after{content:"";position:absolute;inset:-5px;border:3px solid rgba(255,255,85,.9);box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000;z-index:2;pointer-events:none;animation:guide 2.4s ease-in-out infinite}
.tool .k{font-size:var(--fs-xs);color:#6b6b6b}
.tool.on .k{color:#bbb}
.xp{position:relative;display:flex;flex-direction:column;align-items:center;width:calc(var(--slot)*9 + 12px)}
.xp-ct{position:absolute;right:2px;top:0;font-size:var(--fs-xs);line-height:1.3;color:#cfcfcf;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}
.xp-lv{font-size:var(--fs-m);line-height:1;color:var(--mc-green);text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000,1px 1px 0 #000;font-variant-numeric:tabular-nums;margin-bottom:2px}
.xp-bar{width:100%;height:7px;background:#000;border:1px solid #000;box-shadow:inset 0 0 0 1px #2a2a2a;position:relative}
.xp-bar i{position:absolute;left:1px;top:1px;bottom:1px;width:0;background:linear-gradient(#b8ff60,#5ec414);transition:width .25s steps(5)}
.hotbar{display:flex;background:rgba(0,0,0,.42);border:2px solid #000;box-shadow:inset 0 0 0 2px #5e5e5e;padding:2px}
.hb{position:relative;width:var(--slot);height:var(--slot);background:rgba(20,20,20,.35);box-shadow:inset 0 0 0 2px #6f6f6f,inset 0 0 0 3px #1c1c1c;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hb img{width:72%;height:72%;object-fit:contain;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.45))}
/* placed: still pickable, so only slightly faded (locked = grey + dark, see .off) */
.hb.placed img{opacity:.7}
.hb.placed::before{content:"";position:absolute;left:4px;bottom:4px;width:8px;height:8px;background:var(--mc-green);box-shadow:0 0 0 1px #000;z-index:1}
.hb.off{cursor:not-allowed}
.hb.off img{filter:grayscale(1) brightness(.5);opacity:.35}
.hb.sel::after{content:"";position:absolute;inset:-5px;border:3px solid #fff;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000;z-index:2;pointer-events:none}
.hb.guide::after{content:"";position:absolute;inset:-5px;border:3px solid rgba(255,255,85,.9);box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000;z-index:2;pointer-events:none;animation:guide 2.4s ease-in-out infinite}
@keyframes guide{50%{border-color:rgba(255,255,85,.35)}}
.hb.empty{cursor:default}
.hb:focus-visible{outline:2px solid var(--mc-yellow);outline-offset:3px;z-index:3}
.hb .n{position:absolute;right:4px;top:2px;font-size:10px;color:#9a9a9a;text-shadow:1px 1px 0 #000}
@media (hover:none){.hb .n{display:none}}

/* book */
.book{position:sticky;top:14px;background:var(--leather);border:2px solid #000;border-radius:3px 6px 6px 3px;padding:10px 10px 12px 18px;box-shadow:inset 6px 0 0 var(--leather-lo),inset 8px 0 0 var(--leather-hi),inset -3px -3px 0 var(--leather-lo),inset 2px 2px 0 var(--leather-hi)}
.book-page{background:var(--page);border:2px solid var(--page-edge);color:var(--page-ink);display:flex;flex-direction:column;max-height:calc(100vh - 60px);min-height:320px;box-shadow:inset 0 0 0 2px #fbf4df,inset 10px 0 18px -12px rgba(90,60,20,.4)}
.book-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 8px;border-bottom:2px solid var(--page-rule);font-size:var(--fs-m)}
.book-head span:last-child{font-size:var(--fs-xs);color:#6b5734}
.clues{overflow:auto;padding:4px 16px 16px;scrollbar-color:#a58b5c transparent}
.clue{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:14px 4px 14px;border-bottom:2px solid var(--page-rule);cursor:pointer;border-radius:2px}
.clue:last-child{border-bottom:0}
.clue.sel{background:rgba(246,190,104,.28);box-shadow:inset 3px 0 0 var(--hl)}
.clue.flash{animation:flash 1.4s ease-out 1}
@keyframes flash{from{background:rgba(255,236,120,.5)}}
.clue .pf{width:52px;height:52px;background:var(--pbg,var(--slot-bg));box-shadow:inset 2px 2px 0 var(--slot-lo),inset -2px -2px 0 var(--gui-hi);display:flex;align-items:center;justify-content:center}
.clue .pf img{width:78%;height:78%;object-fit:contain}
.clue .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.clue .nm{font-size:var(--fs-m)}
.clue .tag{font-size:var(--fs-m);padding:2px 7px 1px;color:#1e1e1e;border:1px solid rgba(0,0,0,.12)}
/* the pixel font has no bold weight: emphasis is colour (Minecraft book ink), never faux-bold */
.clue .adv{margin:-2px 0 6px;font-size:var(--fs-m);line-height:1.4;color:var(--ink-adv);word-break:keep-all}
.clue .tx{margin:0;font-size:var(--fs-m);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-line}
.clue .q{margin:10px 0 0;font-size:var(--fs-m);line-height:1.5;color:var(--ink-quote);word-break:keep-all;white-space:pre-line}

/* phone: the selected piece's clue, pinned above the tools */
.dclue{display:none}

/* confirm */
#confirm{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#confirm[hidden]{display:none}
.cf-box{width:min(420px,100%);background:var(--tip-bg);box-shadow:0 0 0 2px #100010;padding:20px 18px 18px;position:relative;text-align:center}
.cf-box::before{content:"";position:absolute;inset:3px;border:2px solid;border-image:linear-gradient(var(--tip-edge-a),var(--tip-edge-b)) 1;opacity:.8;pointer-events:none}
.cf-box p{margin:0 0 6px;font-size:var(--fs-m);line-height:1.5}
.cf-box p.sub{color:var(--mc-gray);font-size:var(--fs-s);margin-bottom:16px}
.cf-btns{display:flex;gap:8px}
.cf-btns .mcbtn{flex:1;height:42px;font-size:var(--fs-m);position:relative}

/* ---------- narrow layout ---------- */
@media (max-width:979px){
  .glayout{grid-template-columns:minmax(0,1fr);gap:16px}
  .book{position:static}
  .book-page{max-height:none}
  .clues{overflow:visible}
  #game{padding-bottom:calc(var(--dockh,170px) + 16px + env(safe-area-inset-bottom,0px))}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;gap:5px;padding-top:10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));background:linear-gradient(rgba(10,7,5,0),rgba(10,7,5,.92) 12px,rgba(10,7,5,.96))}
  .tools{gap:5px;flex-wrap:nowrap;width:100%;max-width:520px}
  .tool{flex:1 1 auto;padding:0 6px;height:36px;font-size:13px;min-width:0;white-space:nowrap}
  .tool .k{display:none}
  .gtitle h2{font-size:var(--fs-xl);line-height:1.1}   /* starting size on phones; fitTitle() may go smaller */
  .gbar{gap:8px}
  .gbar .mcbtn{padding:0 8px}
  .dclue{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:start;width:100%;max-width:520px;margin:0 0 1px;padding:6px 8px 6px 6px;text-align:left;background:var(--page);color:var(--page-ink);border:2px solid #000;box-shadow:inset 0 0 0 2px #fbf4df;cursor:pointer;text-shadow:none;font:inherit}
  .dclue .pf{width:34px;height:34px;background:var(--pbg,var(--slot-bg));box-shadow:inset 2px 2px 0 var(--slot-lo),inset -2px -2px 0 var(--gui-hi);display:flex;align-items:center;justify-content:center}
  .dclue .pf img{width:80%;height:80%;object-fit:contain}
  .dclue .dc-hd{display:flex;align-items:baseline;gap:6px;min-width:0;font-size:14px;line-height:1.3}
  .dclue .dc-hd .adv{flex:1 1 auto;min-width:0;color:var(--ink-adv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dclue .dc-hd .go{flex:none;color:#6b5734;font-size:12px}
  .dclue .dc-tx{margin:2px 0 0;font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
}

<div id="app">
  <!-- TITLE -->
  <section id="title" class="death" aria-label="타이틀 화면">
    <div class="ds-main">
      <h1 class="ds-title">죽었습니다!</h1>
      <p class="ds-msg">_Aharks이(가) ■■■■에게 살해당했습니다</p>
      <p class="ds-score">점수: <span class="y" id="title-score">???</span></p>
      <div class="ds-btns" id="stage-btns"></div>
    </div>
    <div class="chat" id="title-chat" aria-label="채팅"></div>
  </section>

  <!-- GAME -->
  <section id="game" hidden aria-label="게임 화면">
    <header class="gbar">
      <button class="mcbtn" id="btn-home" type="button">◀ 타이틀</button>
      <div class="gtitle"><h2 id="g-title"></h2></div>
      <button class="mcbtn" id="btn-rules" type="button">규칙</button>
    </header>
    <div class="glayout">
      <div class="gleft">
        <div class="inv" id="inv">
          <div class="board-wrap" id="board-wrap">
            <svg class="side-ax" id="ax-z" aria-hidden="true" hidden></svg>
            <svg class="side-ax" id="ax-x" aria-hidden="true" hidden></svg>
            <div class="grid" id="grid" role="grid" aria-label="게임판"></div>
            <div class="popup" id="popup" hidden></div>
          </div>
        </div>
        <div class="dock" id="dock">
          <button class="dclue" id="dclue" type="button" hidden></button>
          <div class="actionbar" id="actionbar" aria-live="polite"></div>
          <div class="tools">
            <button class="mcbtn tool" id="t-memo" type="button" aria-pressed="false">메모 <span class="k">M</span></button>
            <button class="mcbtn tool" id="t-x" type="button" aria-pressed="false" disabled>X 표시 <span class="k">X</span></button>
            <button class="mcbtn tool" id="t-erase" type="button" aria-pressed="false">지우개 <span class="k">E</span></button>
            <button class="mcbtn tool on" id="t-label" type="button" aria-pressed="true">지형 이름표 <span class="k">N</span></button>
            <button class="mcbtn tool submit" id="t-submit" type="button">정답 제출</button>
          </div>
          <div class="xp"><span class="xp-lv" id="timer">0:00</span><span class="xp-ct" id="xp-ct"></span><div class="xp-bar"><i id="xp"></i></div></div>
          <div class="hotbar" id="hotbar" role="toolbar" aria-label="말 선택"></div>
        </div>
        <div class="inv lgp" id="lgp"><div class="legend" id="legend"></div></div>
      </div>
      <aside class="book" aria-label="단서">
        <div class="book-page">
          <div class="book-head"><span>단서</span><span id="book-sub"></span></div>
          <div class="clues" id="clues"></div>
        </div>
      </aside>
    </div>
  </section>

  <div id="catcher" hidden></div>

  <!-- ENDING -->
  <section id="end" hidden aria-label="정답 화면">
    <div class="death">
      <div class="ds-main">
        <h1 class="ds-title">정답입니다!</h1>
        <p class="ds-msg" id="end-msg"></p>
        <p class="ds-score">점수: <span class="y" id="end-score">-</span></p>
        <div class="ds-btns">
          <button class="mcbtn" id="end-next" type="button">다음 게임</button>
          <button class="mcbtn" id="end-title" type="button">타이틀 화면</button>
        </div>
      </div>
      <div class="chat" id="end-chat"></div>
    </div>
  </section>

  <div id="confirm" hidden>
    <div class="cf-box" role="dialog" aria-modal="true" aria-labelledby="cf-q">
      <p id="cf-q">타이틀 화면으로 돌아갈까요?</p>
      <p class="sub">이 판에 놓은 말과 메모, 플레이 시간은 저장되지 않습니다.</p>
      <div class="cf-btns">
        <button class="mcbtn" id="cf-yes" type="button">돌아가기</button>
        <button class="mcbtn" id="cf-no" type="button">계속 플레이</button>
      </div>
    </div>
  </div>
</div>

function movePick(d){

  if (pick !== old && document.activeElement && document.activeElement.disabled) $('#pk-stage').focus();
}
function renderChat(box, lines){
  box.innerHTML = '';

    const p = document.createElement('p');
    if (ln.startsWith('&e')) { p.className = 'ye'; p.textContent = ln.slice(2); } else p.textContent = ln;
    if (!p.textContent.startsWith('<')) p.classList.add('sys');   /* not a player's <name> line */

/* ================= GAME STATE ================= */
let G = null;
let cells = [];
let timerId = 0;

function newGame(id){
  const st = STAGES[id];
  const C = st.C, R = C, N = R*C;
  const zone = st.zone.slice(), obj = st.obj.slice();
  const pieces = st.pieces.map(p => ({sym:p.sym, ch:p.ch, ans:p.ans}));
  return { id, st, R, C, N, zone, obj, pieces,
    pos:{}, at:Array(N).fill(null), memo:Array.from({length:N}, () => new Set()), xs:new Set(),
    sel:null, memoMode:false, xTool:false, eraser:false, labels:true, hl:null,
    tut:0, seen:new Set(), t0:Date.now(), elapsed:0, done:false, moving:false };
}
const sym2p = sym => G.pieces.find(p => p.sym === sym);
const rowOf = i => Math.floor(i / G.C), colOf = i => i % G.C;

function lines(exclude){
  const rows = new Set(), cols = new Set();
  for (const [s, i] of Object.entries(G.pos)) if (s !== exclude) { rows.add(rowOf(i)); cols.add(colOf(i)); }
  return {rows, cols};
}
function canPlace(sym, i){
  const o = G.obj[i];
  if (o && !VEH.has(o)) return 'obj';
  if (G.at[i] && G.at[i] !== sym) return 'occ';
  const L = lines(sym);
  if (L.rows.has(rowOf(i)) || L.cols.has(colOf(i))) return 'line';
  return '';
}
function selectable(sym){
  if (G.st.mode !== 'tutorial' || G.tut >= TUT_SEQ.length) return true;
  if (sym === TUT_SEQ[G.tut]) return true;
  const k = TUT_SEQ.indexOf(sym);
  return k > -1 && k < G.tut && G.pos[sym] == null;
}
function memoable(i){ const o = G.obj[i]; return !(o && !VEH.has(o)) && !G.at[i]; }

/* ================= ACTIONS ================= */
function place(sym, i){
  const prev = G.pos[sym];
  if (prev != null) G.at[prev] = null;
  G.pos[sym] = i; G.at[i] = sym;
  G.moving = false;   /* placed: its row/column are dithered right away */
  for (const m of G.memo) m.delete(sym);
  tutorialAfterPlace(sym);
  render();
}
function eraseAt(i, visited){
  const s = G.at[i];
  if (s) { G.at[i] = null; delete G.pos[s]; return true; }
  if (G.memo[i].size || G.xs.has(i)) { G.memo[i].clear(); G.xs.delete(i); return true; }
  return false;
}
function selectPiece(sym){
  if (!selectable(sym)) { hint('지금은 이 말을 고를 수 없습니다', 'warn'); return; }
  if (G.sel === sym) { G.sel = null; G.moving = false; render(); return; }
  G.sel = sym; G.eraser = false; G.xTool = false;
  G.moving = G.pos[sym] != null;   /* re-picking a placed piece = moving it */
  hint(CH[sym2p(sym).ch].name, 'info');
  render(); bookToSel();
  maybeSelectPopup(sym);
}
function deselect(){ if (G.sel || G.xTool) { G.sel = null; G.xTool = false; render(); } }

function maybeSelectPopup(sym){
  const m = G.st.mode;
  if (m === 'tutorial') {
    const key = {0:'t1', 1:'t3', 3:'t4'}[G.tut];
    if (key && sym === TUT_SEQ[G.tut] && !G.seen.has(key)) { G.seen.add(key); showPopup(POP[key], key === 't1' ? focusClue : null); }
  } else if ((m === 's1' || m === 's2') && !G.seen.has(m)) { G.seen.add(m); showPopup(POP[m]); }
}
/* tutorial progress = how many pieces of TUT_SEQ, in order, sit on their correct cells right now */
function tutSync(){
  if (!G || G.st.mode !== 'tutorial') return;
  let t = 0;
  while (t < TUT_SEQ.length && G.pos[TUT_SEQ[t]] === sym2p(TUT_SEQ[t]).ans) t++;
  G.tut = t;
  if (G.sel && !selectable(G.sel)) G.sel = null;
}
function tutorialAfterPlace(sym){
  if (G.st.mode !== 'tutorial') return;
  const before = G.tut; tutSync();
  if (before === 0 && G.tut >= 1 && !G.seen.has('t2')) { G.seen.add('t2'); showPopup(POP.t2); }
  if (G.tut <= before && G.tut < TUT_SEQ.length && sym === TUT_SEQ[G.tut]) hint('이 칸이 아닌 것 같습니다. 단서를 다시 읽어보세요!', 'warn');
}

function tapCell(i){
  if (G.done) return;
  const occ = G.at[i];
  if (!G.sel) {
    if (occ) { if (selectable(occ)) selectPiece(occ); else hint('지금은 이 말을 고를 수 없습니다', 'warn'); }
    else hint('아래 소지품 칸에서 놓을 말을 먼저 고르세요');
    return;
  }
  if (occ === G.sel) return;
  if (occ) { if (selectable(occ)) selectPiece(occ); else hint('이미 다른 말이 놓인 칸입니다', 'warn'); return; }
  const why = canPlace(G.sel, i);
  if (why) { shake(i); hint(why === 'obj' ? '사물이 놓인 칸에는 말을 놓을 수 없습니다' : '같은 행이나 같은 열에 이미 말이 있습니다', 'warn'); return; }
  place(G.sel, i);
}

/* drag gesture for memo / eraser */
let gest = null;
function gestureStart(i){
  if (G.eraser) { gest = {kind:'erase', seen:new Set()}; gestureApply(i); return true; }
  if (!G.memoMode) return false;
  if (G.xTool) { gest = {kind:'x', add:!G.xs.has(i), seen:new Set()}; }
  else if (G.sel) { gest = {kind:'memo', sym:G.sel, add:!G.memo[i].has(G.sel), seen:new Set()}; }
  else { hint('메모할 말이나 X 표시를 먼저 고르세요'); return true; }
  gestureApply(i); return true;
}
function gestureApply(i){
  if (!gest || gest.seen.has(i)) return;
  gest.seen.add(i);
  let changed = false;
  if (gest.kind === 'erase') changed = eraseAt(i);
  else if (memoable(i)) {
    if (gest.kind === 'x') { if (gest.add) G.xs.add(i); else G.xs.delete(i); changed = true; }
    else { if (gest.add) G.memo[i].add(gest.sym); else G.memo[i].delete(gest.sym); changed = true; }
  }
  if (changed) render();
}

function submit(){
  if (G.done) return;
  const n = Object.keys(G.pos).length, total = G.pieces.length;
  if (n < total) { showPopup({h:'아직 놓지 않은 말이 있습니다', l:[`모든 말을 판 위에 놓은 뒤 제출해주세요. (${n}/${total})`]}); return; }
  const ok = G.pieces.every(p => G.pos[p.sym] === p.ans);
  if (!ok) { showPopup({bad:'틀렸습니다!', l:[]}); return; }
  win();
}
function win(){
  G.done = true; G.elapsed = Date.now() - G.t0; stopTimer();
  const id = G.id;
  if (!prog.cleared.includes(id)) { prog.cleared.push(id); prog.first[id] = G.elapsed; if (id + 1 < STAGES.length && id + 1 > 1) freshUnlock = id + 1; }
  else if (prog.first[id] == null) prog.first[id] = prog.best[id] ?? G.elapsed;
  if (!prog.best[id] || G.elapsed < prog.best[id]) prog.best[id] = G.elapsed;
  saveProg();
  showEnd();
}
function showEnd(){
  screen = 'end';

  $('#end-msg').textContent = st.end.msg;

function buildBoard(){
  const {R, C, N, st} = G;
  const wrap = $('#board-wrap');
  wrap.style.setProperty('--cols', C); wrap.style.setProperty('--rows', R);
  const nm = G.pieces.length, mc = nm <= 4 ? 2 : 3;

  for (const id of ['#ax-z', '#ax-x']) $(id).toggleAttribute('hidden', !st.sideAxes);
  const grid = $('#grid');
  grid.innerHTML = '';
  /* label cells: first cell (reading order) of each connected zone region that has no object on it,

  const labelAt = new Map(), seen = new Uint8Array(N);
  for (let i = 0; i < N; i++) {

    while (q.length) { const k = q.pop(), r = rowOf(k), c = colOf(k);
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) { const rr = r+dr, cc = c+dc;
        if (rr < 0 || cc < 0 || rr >= R || cc >= C) continue; const j = rr*C+cc;
        if (!seen[j] && G.zone[j] === G.zone[i]) { seen[j] = 1; q.push(j); region.push(j); } } }
    const free = region.filter(k => !G.obj[k]);

    }

    if (st.digits) h += `<span class="dig">${st.digits[rowOf(i)][colOf(i)]}</span>`;
    d.innerHTML = h;

    const i = r*C+c;
    if (c < C-1 && G.zone[i] !== G.zone[i+1]) seg += `M${c+1} ${r}V${r+1}`;
    if (r < R-1 && G.zone[i] !== G.zone[i+C]) seg += `M${c} ${r+1}H${c+1}`;
  }

    /* terrain borders: dark line + thin light core, so they show on dark (nether, deep dark) and light terrain alike */
    `<svg class="ov zl" viewBox="0 0 ${C} ${R}" preserveAspectRatio="none" aria-hidden="true"><path d="${seg}" fill="none" stroke="var(--zone-line)" stroke-width="5" stroke-linecap="square" vector-effect="non-scaling-stroke"/><path d="${seg}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5" stroke-linecap="square" vector-effect="non-scaling-stroke"/></svg>` +
    `<svg class="ov hl" id="hl-svg" viewBox="0 0 ${C} ${R}" preserveAspectRatio="none" aria-hidden="true"></svg>` +
    (st.axes ? '<svg class="ov ax" id="ax-svg" aria-hidden="true"></svg>' : ''));
}

function drawSideAxes(cell, m, small){

/* ================= RENDER ================= */
function render(){
  if (!G) return;
  tutSync();
  /* blocked dither shows as soon as a piece is placed; only while an already-placed piece is re-picked
     to be moved are its own row/column left open (same rule as canPlace) */
  const L = lines(G.moving && G.sel && !G.memoMode && !G.eraser ? G.sel : null);
  const nm = G.pieces.length;
  const memoOrder = G.pieces.map(p => p.sym);
  const mc = nm <= 4 ? 2 : 3;
  for (let i = 0; i < G.N; i++) {
    const el = cells[i], occ = G.at[i];
    el.classList.toggle('occ', !!occ);
    el.classList.toggle('blocked', !occ && (L.rows.has(rowOf(i)) || L.cols.has(colOf(i))));
    el.classList.toggle('x', G.xs.has(i));
    el.classList.toggle('me', !!occ && occ === G.sel);
    const pk = occ || '';
    if (el._pk !== pk) {
      el._pk = pk;
      const pc = el.querySelector('.pc'), c = occ ? CH[sym2p(occ).ch] : null;
      pc.innerHTML = c ? `<img alt="${esc(c.name)}" src="${A[c.img]}">` : '';
      if (c && c.tag) pc.style.setProperty('--pbg', `var(${c.tag})`); else pc.style.removeProperty('--pbg');
    }
    const mk = [...G.memo[i]].sort().join(',');
    if (el._mk !== mk) {
      el._mk = mk;
      /* player memos sit on their tag colour, so they read by colour even when the face is tiny */
      el.querySelector('.memo').innerHTML = memoOrder.map((s, k) => {
        if (!G.memo[i].has(s)) return '';
        const c = CH[sym2p(s).ch];
        return `<i style="grid-column:${k % mc + 1};grid-row:${Math.floor(k / mc) + 1}${c.tag ? `;background:var(${c.tag})` : ''}"><img alt="" src="${A[c.img]}"></i>`;
      }).join('');
    }
    el.classList.toggle('can', !!G.sel && !G.memoMode && !G.eraser && !G.done && !canPlace(G.sel, i) && G.at[i] !== G.sel);
  }
  $('#grid').classList.toggle('nolab', !G.labels);
  $('#grid').classList.toggle('drag', G.memoMode || G.eraser);
  renderTools(); renderHotbar(); renderBook(); renderHL(); renderDockClue();
  const placed = Object.keys(G.pos).length;
  $('#xp').style.width = `calc(${placed / nm * 100}% - ${placed ? 2 : 0}px)`;
  $('#xp-ct').textContent = `배치 ${placed}/${nm}`;
}
function renderTools(){
  const set = (id, on, dis) => { const b = $(id); b.classList.toggle('on', !!on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); if (dis !== undefined) b.disabled = dis; };
  set('#t-memo', G.memoMode); set('#t-x', G.memoMode && G.xTool, !G.memoMode); set('#t-erase', G.eraser); set('#t-label', G.labels);
  /* every stage: once all pieces are on the board, point at 정답 제출

/* clue order stays fixed (hotbar order); the selected card is highlighted and scrolled to instead of jumping to the top */
function renderBook(){
  const box = $('#clues');
  const key = G.id + '|' + G.pieces.map(p => p.sym).join('');
  if (box._key !== key) {
    box._key = key;
    box.innerHTML = G.pieces.map(p => {
      const c = CH[p.ch], [chal, act, quote] = G.st.clues[p.sym];
      const tagBg = c.tag ? `var(${c.tag})` : 'var(--tag-mob)';
      return `<article class="clue" data-s="${p.sym}">
        <div class="pf"${c.tag ? ` style="--pbg:var(${c.tag})"` : ''}><img alt="" src="${A[c.img]}"></div>
        <div><div class="hd"><span class="nm">${esc(c.name)}</span><span class="tag" style="background:${tagBg}">${c.victim ? '피해자' : '용의자'}</span></div>
        <p class="adv">[${esc(chal)}]</p>
        <p class="tx">${esc(trimLines(act))}</p>
        <p class="q">"${esc(trimLines(quote))}"</p></div></article>`;
    }).join('');
  }
  box.querySelectorAll('.clue').forEach(a => a.classList.toggle('sel', a.dataset.s === G.sel));
}
function flashCard(card){ card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
function bookToSel(){
  const card = G && G.sel && $(`#clues .clue[data-s="${G.sel}"]`); if (!card) return;
  if (!isNarrow()) {
    /* desktop: scroll inside the book only */
    const box = $('#clues');
    box.scrollBy({top:card.getBoundingClientRect().top - box.getBoundingClientRect().top - 4, behavior:'smooth'});
    flashCard(card); return;
  }
  /* phone: the dock shows the clue; only follow along if the reader is already looking at the book */
  const r = $('.book').getBoundingClientRect(), dockTop = window.innerHeight - $('#dock').offsetHeight;
  if (r.top < dockTop && r.bottom > 0) { window.scrollBy({top:card.getBoundingClientRect().top - 10, behavior:'smooth'}); flashCard(card); }
}
/* phone: the selected piece's clue (first lines) pinned above the tools; tap → full clue in the book */
function renderDockClue(){
  const box = $('#dclue');
  const show = !!G && !!G.sel && !G.done && isNarrow();
  const key = show ? G.id + G.sel : '';
  if (box._key !== key) {
    box._key = key;
    if (show) {
      const p = sym2p(G.sel), c = CH[p.ch], [chal, act] = G.st.clues[p.sym];
      box.innerHTML = `<span class="pf"${c.tag ? ` style="--pbg:var(${c.tag})"` : ''}><img alt="" src="${A[c.img]}"></span>
        <span><span class="dc-hd"><span>${esc(c.name)}</span><span class="adv">[${esc(chal)}]</span><span class="go">전체 단서 ▼</span></span>
        <span class="dc-tx">${esc(trimLines(act).replace(/\n/g, ' '))}</span></span>`;
      box.setAttribute('aria-label', `${c.name} 단서 전체 보기`);
    }
    box.hidden = !show;
    measureDock();
  }
}
function measureDock(){
  if (!isNarrow()) return;
  document.documentElement.style.setProperty('--dockh', $('#dock').offsetHeight + 'px');
}
function renderHL(){
  const svg = $('#hl-svg'); if (!svg) return;
  document.querySelectorAll('.lg-it').forEach(b => { const on = !!G.hl && b.dataset.t === G.hl.t && b.dataset.k === G.hl.k; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  if (!G.hl) { svg.innerHTML = ''; return; }
  const inSet = i => G.hl.t === 'z' ? G.zone[i] === G.hl.k : G.obj[i] === G.hl.k;
  let fill = '', seg = '';
  for (let i = 0; i < G.N; i++) {
    if (!inSet(i)) continue;
    const r = rowOf(i), c = colOf(i);
    fill += `M${c} ${r}h1v1h-1z`;
    if (r === 0 || !inSet(i - G.C)) seg += `M${c} ${r}H${c+1}`;
    if (r === G.R-1 || !inSet(i + G.C)) seg += `M${c} ${r+1}H${c+1}`;
    if (c === 0 || !inSet(i - 1)) seg += `M${c} ${r}V${r+1}`;
    if (c === G.C-1 || !inSet(i + 1)) seg += `M${c+1} ${r}V${r+1}`;
  }
  svg.innerHTML = `<path d="${fill}" fill="rgba(85,255,255,.26)"/><path d="${seg}" fill="none" stroke="var(--hl-map-edge)" stroke-width="7" stroke-linecap="square" vector-effect="non-scaling-stroke" opacity=".7"/><path d="${seg}" fill="none" stroke="var(--hl-map)" stroke-width="4" stroke-linecap="square" vector-effect="non-scaling-stroke"/>`;
}

/* one-line title: largest size up to 48px (phone 24px) that fits next to the buttons, never below 14px */
function fitTitle(){
  const h = $('#g-title'); if (!h || !h.clientWidth) return;
  let fs = isNarrow() ? 24 : 48;
  h.style.fontSize = fs + 'px';
  while (h.scrollWidth > h.clientWidth && fs > 14) { fs -= 1; h.style.fontSize = fs + 'px'; }
}
function fit(){
  if (!G) return;
  fitTitle();
  const inv = $('#inv'), wrap = $('#board-wrap');
  const cs = getComputedStyle(inv);
  const avail = inv.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const small = avail < 430, st = G.st;
  /* margins: room for the side Z+/X+ guides (3–5) or the centre-axis labels (2) */
  const m = st.sideAxes ? {l:small ? 22 : 30, r:4, t:4, b:small ? 22 : 28}
          : st.axes ? {l:4, r:small ? 16 : 22, t:small ? 16 : 22, b:6}
          : {l:6, r:6, t:6, b:8};
  let cell = Math.floor((avail - m.l - m.r) / G.C);
  if (!isNarrow()) cell = Math.min(cell, Math.max(40, Math.floor((window.innerHeight - 330) / G.R)));
  cell = Math.max(24, Math.min(G.st.maxCell, cell));
  wrap.style.setProperty('--cell', cell + 'px');
  for (const [k, v] of Object.entries({pl:m.l, pr:m.r, pt:m.t, pb:m.b})) wrap.style.setProperty('--' + k, v + 'px');
  drawSideAxes(cell, m, small);
  const slot = isNarrow() ? Math.min(46, Math.floor((window.innerWidth - 32) / 9)) : 46;
  document.documentElement.style.setProperty('--slot', slot + 'px');
  drawAxes();
  renderDockClue();
  requestAnimationFrame(measureDock);
}

/* ================= POPUP / HINT ================= */
let popupOpen = false, popupAfter = null;
function showPopup(p, after){
  popupAfter = after || null;
  const box = $('#popup');
  let h = '';
  if (p.bad) h += `<h3 class="bad">${esc(p.bad)}</h3>`;
  if (p.h) h += `<h3>${esc(p.h)}</h3>`;
  for (const ln of p.l) h += `<p>${esc(ln)}</p>`;
  h += '<p class="foot">화면을 누르면 닫힙니다</p>';
  box.innerHTML = h; box.hidden = false;
  box.classList.toggle('rules', !!p.rules);
  box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
  $('#catcher').hidden = false; popupOpen = true;
  if (p.rules) return;
  const r = box.getBoundingClientRect();
  if (r.top < 0 || r.bottom > window.innerHeight - (isNarrow() ? ($('#dock').offsetHeight) : 0)) box.scrollIntoView({block:'center', behavior:'smooth'});
}
function closePopup(){
  if (!popupOpen) return;
  $('#popup').hidden = true; $('#catcher').hidden = true; popupOpen = false;
  const f = popupAfter; popupAfter = null; if (f) f();
}
/* after a rule popup: bring the selected piece's clue into view and flash it */
function focusClue(){
  if (!G || !G.sel) return;
  const box = $('#clues'), c = box.querySelector('.clue.sel');
  if (!c) return;
  if (!isNarrow()) box.scrollBy({top:c.getBoundingClientRect().top - box.getBoundingClientRect().top - 4, behavior:'smooth'});
  const r = c.getBoundingClientRect();
  if (isNarrow() || r.top < 0 || r.top > window.innerHeight * .4) window.scrollBy({top:r.top - 12, behavior:'smooth'});
  flashCard(c);
}
/* all rules in one popup (stage-specific extras included), any time from the top bar */
function showRules(){
  if (!G || popupOpen) return;
  const l = [POP.t1.l[0], POP.t2.l[0], POP.t3.l[0]];
  if (G.id >= 1) l.push(POP.s2.l[1]);
  if (G.id >= 2) l.push(POP.s2.l[2]);
  l.push(...POP.t4.l);
  showPopup({h:'Game Rule', l, rules:true});
}
/* action bar: transient messages (info = white, warn = red); otherwise the current mode stays shown */
let hintT = 0, hintOn = false;
function modeText(){
  if (!G || G.done || screen !== 'game') return '';
  if (G.eraser) return '지우개 모드';
  if (G.memoMode) return G.xTool ? '메모 모드 · X 표시' : '메모 모드';
  return '';
}
function setBar(){
  if (hintOn) return;
  const a = $('#actionbar'), t = modeText();
  if (t) { a.textContent = t; a.className = 'actionbar on mode'; }
  else a.classList.remove('on');   /* keep text + colour while it fades out */
}
function hint(msg, kind){
  const a = $('#actionbar'); a.textContent = msg;
  a.className = 'actionbar on' + (kind === 'warn' ? ' warn' : '');
  hintOn = true; clearTimeout(hintT);
  hintT = setTimeout(() => { hintOn = false; setBar(); }, 2400);
}
function shake(i){ const el = cells[i]; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ================= TIMER ================= */
function startTimer(){
  stopTimer();
  const tick = () => { if (G && !G.done) $('#timer').textContent = fmt(Date.now() - G.t0); };
  tick(); timerId = setInterval(tick, 500);
}
function stopTimer(){ clearInterval(timerId); timerId = 0; }

/* ================= EVENTS ================= */
const cellIdx = t => { const c = t && t.closest ? t.closest('.cell') : null; return c ? +c.dataset.i : -1; };
const grid = $('#grid');
grid.addEventListener('pointerdown', e => {
  if (!G || G.done || popupOpen) return;
  const i = cellIdx(e.target); if (i < 0) return;
  if (G.eraser || G.memoMode) { e.preventDefault(); gestureStart(i); }
});
window.addEventListener('pointermove', e => {
  if (!gest) return;
  const i = cellIdx(document.elementFromPoint(e.clientX, e.clientY));
  if (i >= 0) gestureApply(i);
});
const endGest = () => { gest = null; };
window.addEventListener('pointerup', endGest); window.addEventListener('pointercancel', endGest);
grid.addEventListener('click', e => {
  if (!G || popupOpen || G.eraser || G.memoMode) return;
  const i = cellIdx(e.target); if (i >= 0) tapCell(i);
});
$('#hotbar').addEventListener('click', e => {
  const b = e.target.closest('.hb[data-s]'); if (!b || !G || G.done) return;
  selectPiece(b.dataset.s);
});
$('#clues').addEventListener('click', e => {
  const a = e.target.closest('.clue'); if (!a || !G || G.done) return;
  if (selectable(a.dataset.s) && G.sel !== a.dataset.s) selectPiece(a.dataset.s);
});
$('#t-memo').addEventListener('click', () => { G.memoMode = !G.memoMode; if (!G.memoMode) G.xTool = false; G.eraser = false; hint(G.memoMode ? '메모 모드: 말을 고르고 칸을 누르거나 끌어서 적습니다' : '메모 모드를 껐습니다'); render(); });
$('#t-x').addEventListener('click', () => { if (!G.memoMode) return; G.xTool = !G.xTool; if (G.xTool) { G.sel = null; G.eraser = false; } render(); });
$('#t-erase').addEventListener('click', () => { G.eraser = !G.eraser; if (G.eraser) { G.sel = null; G.xTool = false; hint('지우개: 놓은 말이나 메모를 누르면 지웁니다'); } render(); });
$('#t-label').addEventListener('click', () => { G.labels = !G.labels; render(); });
$('#t-submit').addEventListener('click', submit);
$('#btn-rules').addEventListener('click', showRules);
$('#dclue').addEventListener('click', () => {
  const card = G && G.sel && $(`#clues .clue[data-s="${G.sel}"]`); if (!card) return;
  window.scrollBy({top:card.getBoundingClientRect().top - 10, behavior:'smooth'});
  flashCard(card);
});
$('#catcher').addEventListener('click', closePopup);
$('#popup').addEventListener('click', closePopup);
$('#btn-home').addEventListener('click', () => {
  if (!G || G.done || (!Object.keys(G.pos).length && G.memo.every(m => !m.size) && !G.xs.size)) { showTitle(); return; }
  $('#confirm').hidden = false; $('#cf-no').focus();
});
$('#cf-yes').addEventListener('click', () => { $('#confirm').hidden = true; showTitle(); });
$('#cf-no').addEventListener('click', () => { $('#confirm').hidden = true; });
$('#end-title').addEventListener('click', () => showTitle());
$('#end-next').addEventListener('click', () => { if (G && G.id + 1 < STAGES.length) startStage(G.id + 1); });

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('#confirm').hidden) { if (e.key === 'Escape') $('#confirm').hidden = true; return; }
  if (popupOpen) { if (['Escape','Enter',' '].includes(e.key)) { e.preventDefault(); closePopup(); } return; }
  if (screen === 'title') { if (e.key === 'ArrowLeft') movePick(-1); else if (e.key === 'ArrowRight') movePick(1); return; }
  if (screen !== 'game' || !G || G.done) return;
  const k = e.key.toLowerCase();
  if (/^[1-9]$/.test(k)) { const p = G.pieces[+k - 1]; if (p) selectPiece(p.sym); }
  else if (k === 'escape' || k === '0') { if (G.hl) { G.hl = null; renderHL(); } deselect(); }
  else if (k === 'm') $('#t-memo').click();
  else if (k === 'x') { if (G.memoMode) $('#t-x').click(); }
  else if (k === 'e') $('#t-erase').click();
  else if (k === 'n') $('#t-label').click();
});
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(fit); });

/* ================= HOT RELOAD SNAPSHOT ================= */
function snapshot(){
  if (!G || screen === 'title') return {screen:'title', pick};
  return {screen, game:{id:G.id, pos:G.pos, memo:G.memo.map((m, i) => [i, [...m]]).filter(x => x[1].length), xs:[...G.xs],
    elapsed:G.done ? G.elapsed : Date.now() - G.t0, tut:G.tut, seen:[...G.seen], labels:G.labels, done:G.done,
    ui:{memo:G.memoMode, x:G.xTool, er:G.eraser, sel:G.sel, hl:G.hl, mv:G.moving}}};
}
function applyRestore(d){
  for (const [s, i] of Object.entries(d.pos || {})) { if (sym2p(s) && i >= 0 && i < G.N) { G.pos[s] = i; G.at[i] = s; } }
  for (const [i, arr] of d.memo || []) for (const s of arr) if (G.memo[i]) G.memo[i].add(s);
  for (const i of d.xs || []) G.xs.add(i);
  G.t0 = Date.now() - (d.elapsed || 0); G.elapsed = d.elapsed || 0;
  G.tut = d.tut || 0; G.seen = new Set(d.seen || []); G.labels = d.labels !== false; G.done = !!d.done;
  /* keep the player's tool state across a live update: memo mode, X, eraser, selected piece, legend highlight */
  const u = d.ui || {};
  G.memoMode = !!u.memo; G.xTool = G.memoMode && !!u.x; G.eraser = !!u.er;
  G.sel = u.sel && sym2p(u.sel) && selectable(u.sel) ? u.sel : null;
  G.hl = u.hl && (u.hl.t === 'z' || u.hl.t === 'o') ? u.hl : null;
  G.moving = !!u.mv && !!G.sel && G.pos[G.sel] != null;
}
try { window.claude?.hot?.snapshot?.(snapshot); } catch(e) {}
function boot(d){
  d = d || {};
  if (d.game && STAGES[d.game.id]) startStage(d.game.id, d.game);
  else { showTitle(); if (d.pick) { pick = d.pick; renderPick(); } }
}
try { document.fonts && document.fonts.ready.then(() => { if (G) fitTitle(); }); } catch(e) {}
const hot = window.claude?.hot;
if (hot?.ready) hot.ready(boot); else boot(hot?.data ?? {});
})();
</script>
